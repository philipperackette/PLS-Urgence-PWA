name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint et cohérence (ESLint, Stylelint, HTMLHint, cache, manifeste, SVG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Cache hors ligne, manifeste et illustrations
        run: npm run test:static
      - name: Les SVG publiés correspondent au générateur
        run: |
          npm run illustrations
          git diff --exit-code -- images/
          test -z "$(git status --porcelain -- images/)"

  e2e:
    name: Tests Playwright (ordinateur, téléphone, petit téléphone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
